name: Keep Render awake

# Render's free tier sleeps after ~15 min idle. Wake it before the 07:59 (Taipei) report.
# Cron is UTC: 23:45 / 23:55 on Sun–Thu = 07:45 / 07:55 Taipei on Mon–Fri.
# Two pings: GitHub's scheduler can run late, and the second keeps it awake until 07:59.
on:
  schedule:
    - cron: "45 23 * * 0-4"
    - cron: "55 23 * * 0-4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health (a cold start can take a minute or more)
        run: >
          curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90
          https://stock-mcp-server-035f.onrender.com/health
